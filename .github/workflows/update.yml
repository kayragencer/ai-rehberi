name: AI Rehberi Otomatik Guncelleme
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: ai-rehberi-update
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: node scripts/update.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MYMEMORY_EMAIL: ${{ secrets.MYMEMORY_EMAIL }}
          PRODUCTHUNT_TOKEN: ${{ secrets.PRODUCTHUNT_TOKEN }}
      - name: Degisiklikleri kaydet
        run: |
          git config user.name "ai-rehberi-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --staged --quiet && exit 0
          git commit -m "Otomatik guncelleme $(date -u +%F\ %H:%M)"
          if git pull --rebase && git push; then exit 0; fi
          git rebase --abort 2>/dev/null || true
          echo "Ayni anda baska bir guncelleme kaydedilmis. Bu tur atlandi, bir sonraki calismada tekrar denenecek."
